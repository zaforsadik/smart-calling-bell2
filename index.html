<!DOCTYPE html>
<html>

<head>
  <title>Smart Calling Bell</title>

  <style>

    body {
      font-family: Arial;
      background: #f2f2f2;
      text-align: center;
      margin-top: 50px;
    }

    .box {
      width: 320px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
    }

    h2 {
      color: #333;
    }

    select,
    input {
      width: 90%;
      padding: 12px;
      margin-top: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 16px;
    }

    button {
      width: 95%;
      padding: 14px;
      margin-top: 20px;
      border: none;
      border-radius: 5px;
      background: red;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: darkred;
    }

    #status {
      margin-top: 20px;
      font-weight: bold;
      color: green;
    }

  </style>
</head>

<body>

  <div class="box">

    <h2>Smart Calling Bell</h2>

    <select id="professor">

      <option>Dr. Rahman</option>
      <option>Dr. Ahmed</option>
      <option>Dr. Karim</option>
      <option>Dr. Hasan</option>
      <option>Dr. Islam</option>

    </select>

    <input
      type="text"
      id="message"
      placeholder="Enter message"
    >

    <button onclick="sendCall()">
      CALL ASSISTANT
    </button>

    <p id="status"></p>

  </div>

<script>

async function sendCall() {

  let professor =
    document.getElementById("professor").value;

  let message =
    document.getElementById("message").value;

  if(message.trim() === "") {

    document.getElementById("status").innerHTML =
      "Please enter a message";

    return;
  }

  try {

    const response = await fetch(
      "https://teachermsg-b10ef-default-rtdb.firebaseio.com/call.json",
      {
        method: "PUT",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({

          professor: professor,
          message: message,
          status: "new"

        })
      }
    );

    if(response.ok) {

      document.getElementById("status").innerHTML =
        "Call Sent Successfully!";

      document.getElementById("message").value = "";

    }

    else {

      document.getElementById("status").innerHTML =
        "Firebase Error";
    }

  }

  catch(error) {

    document.getElementById("status").innerHTML =
      "Connection Error";

    console.log(error);
  }
}

</script>

</body>
</html>
